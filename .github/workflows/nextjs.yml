name: Deploy Application

on:
  push:
    branches: [ "preet" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.15.1'
          cache: 'npm'

      - name: Install dependencies (bypass postinstall)
        run: |
          npm ci --ignore-scripts
          npm install --save-dev @types/node
          echo "Dependencies installed without postinstall scripts"
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: true

      - name: Build application (direct Next.js build)
        run: npx next build
        env:
          NODE_ENV: production
          NODE_OPTIONS: --max_old_space_size=4096
          SKIP_TYPE_CHECK: true

      - name: Prepare deployment files
        run: |
          rm -rf .git .next/cache node_modules
          echo "Deployment files ready"

      - name: Fix remote permissions
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY_LIVE }}
          script: |
            sudo chown -R ${{ secrets.SERVER_USER }}:${{ secrets.SERVER_USER }} /home/ec2-user/jdp-stagging/
            sudo chmod -R 755 /home/ec2-user/jdp-stagging/

      - name: Deploy via Rsync 
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY_LIVE }}
          REMOTE_HOST: ${{ secrets.SERVER_IP }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          TARGET: /home/ec2-user/jdp-stagging/
          ARGS: "-rlgoDzvc --chmod=Du=rwx,Dg=rx,Do=rx,Fu=rw,Fg=r,Fo=r --no-perms --no-owner --no-group --exclude=.next/cache --exclude=node_modules --exclude=.git --exclude=src"

      - name: Skip server dependencies (already built on GitHub Actions)
        run: |
          echo "Skipping server dependencies installation - already built on GitHub Actions"

      - name: Restart application (safe reload)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY_LIVE }}
          script: |
            cd /home/ec2-user/jdp-stagging/

            # Check if PM2 process exists
            if pm2 list | grep -q "jdp-stagging"; then
              echo "Process already exists — restarting..."
              pm2 restart jdp-stagging
            else
              echo "Starting new PM2 process..."
              PORT=3001 pm2 start "npx next start" --name jdp-stagging --cwd /home/ec2-user/jdp-stagging/
            fi

            pm2 save
            pm2 status
